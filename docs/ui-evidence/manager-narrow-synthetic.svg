  <text x="20" y="49" class="text tiny muted">Reconstructed from PR #121 and post-review source; not a browser capture.</text>
  <rect x="15" y="65" width="390" height="1210" rx="18" fill="#fbfaf8" stroke="#d8d5ce" stroke-width="1.4"/>
  <g transform="translate(3 0) scale(.9)">

  <text x="36" y="105" class="text tiny muted" letter-spacing="1">LEESH LOOP</text>
  <text x="36" y="137" class="text" font-size="29" font-weight="700">Manager</text>
  <rect x="36" y="151" width="87" height="28" rx="14" fill="#e9eee9"/>
  <circle cx="51" cy="165" r="4.5" fill="#347a54"/>
  <text x="63" y="170" class="text tiny" font-weight="650">Stopped</text>
  <text x="36" y="205" class="text body" font-weight="650">payments-service</text>
  <text x="36" y="228" class="text tiny muted">/work/projects/payments-service</text>
  <rect x="36" y="243" width="131" height="39" rx="8" class="button"/>
