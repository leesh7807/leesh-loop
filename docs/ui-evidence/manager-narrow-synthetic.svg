  <text x="156" y="1216" text-anchor="middle" class="text tiny" font-weight="650">Install source Runtime</text>
  <line x1="48" y1="1244" x2="412" y2="1244" class="rule"/>
  <text x="48" y="1271" class="text small" font-weight="650">Workflow</text>
  <text x="412" y="1271" text-anchor="end" class="text tiny muted">Current</text>
  <text x="48" y="1303" class="text small" font-weight="650">Loop logs</text>
  <text x="412" y="1303" text-anchor="end" class="text tiny muted">View startup output</text>
  <text x="30" y="1362" class="text tiny muted">Illustrative labels and sample task content; not live user data.</text>
