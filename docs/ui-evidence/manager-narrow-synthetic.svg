<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1300" viewBox="0 0 420 1300" role="img" aria-labelledby="title description">
  <title id="title">Synthetic narrow Manager review fixture</title>
  <desc id="description">A labeled reconstruction of the final Manager hierarchy at a narrow mobile width. This is not a browser capture.</desc>
  <defs>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #282724; }
      .muted { fill: #716e68; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .heading { font-size: 22px; font-weight: 650; }
      .card { fill: #fff; stroke: #dedbd4; stroke-width: 1.4; }
      .soft { fill: #f8f7f4; stroke: #e3e0d9; stroke-width: 1.2; }
      .rule { stroke: #e4e1da; stroke-width: 1.2; }
      .button { fill: #292824; }
      .button-label { fill: #fff; }
    </style>
  </defs>
  <rect width="460" height="1450" fill="#f3f1ec"/>
