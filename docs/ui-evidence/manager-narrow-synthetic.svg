  <text x="48" y="1098" class="text tiny muted">running Loops keep their pinned version.</text>
  <text x="48" y="1128" class="text tiny">Source checkout <tspan font-weight="650">0.1.0 · 7c21a0f97b12</tspan></text>
  <text x="48" y="1150" class="text tiny">Manager service <tspan font-weight="650">0.1.0 · 7c21a0f97b12</tspan></text>
  <text x="48" y="1172" class="text tiny">Selected Loop <tspan font-weight="650">0.1.0 · 7c21a0f97b12</tspan></text>
