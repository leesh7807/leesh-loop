<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title description">
  <title id="title">Synthetic failed Loop with confirmed process absence</title>
  <desc id="description">A synthetic Manager state where a Loop failed before starting, Manager confirms no process is active, and unregistration is enabled while repository and task data retention is explicit. Not a browser capture.</desc>
  <defs>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #282724; }
      .muted { fill: #716e68; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .heading { font-size: 23px; font-weight: 650; }
      .title { font-size: 31px; font-weight: 700; }
      .card { fill: #fff; stroke: #dedbd4; stroke-width: 1.5; }
      .soft { fill: #f8f7f4; stroke: #e3e0d9; stroke-width: 1.2; }
      .rule { stroke: #e4e1da; stroke-width: 1.2; }
      .button { fill: #fff; stroke: #c9c5bc; stroke-width: 1.4; }
      .failure { fill: #7f3434; }
    </style>
  </defs>
  <rect width="1040" height="560" fill="#f3f1ec"/>
  <text x="30" y="34" class="text tiny" font-weight="700" letter-spacing="1.2">SYNTHETIC VISUAL REVIEW FIXTURE · FAILED WITH NO ACTIVE PROCESS</text>
  <text x="30" y="57" class="text tiny muted">Reconstructed from the post-review JSX/CSS. Not a browser capture. Repository and identity are illustrative.</text>
  <rect x="20" y="78" width="1000" height="452" rx="18" fill="#fbfaf8" stroke="#d8d5ce" stroke-width="1.5"/>

  <text x="54" y="128" class="text tiny muted" letter-spacing="1.2">LEESH LOOP</text>
  <text x="54" y="163" class="text title">Manager</text>
  <rect x="254" y="112" width="82" height="30" rx="15" fill="#f7e7e4"/>
  <circle cx="270" cy="127" r="5" fill="#9b4242"/>
  <text x="283" y="133" class="text small" font-weight="650" fill="#7f3434">Failed</text>
  <text x="355" y="134" class="text body" font-weight="650">payments-service</text>
  <text x="355" y="158" class="text small muted">/work/projects/payments-service</text>
  <text x="54" y="199" class="text small failure">The Loop failed and no active process remains. Review diagnosis and logs before restarting.</text>
  <text x="54" y="225" class="text tiny muted">Diagnosis is available separately; this state does not claim that a running process was stopped.</text>

  <rect x="50" y="254" width="940" height="235" rx="12" class="card"/>
  <path d="M72 285 l7 7 7-7" fill="none" stroke="#55524d" stroke-width="2"/>
  <text x="101" y="294" class="text body" font-weight="650">Manage current Loop</text>
  <text x="965" y="294" text-anchor="end" class="text small muted">Runtime, Workflow, and diagnosis</text>
  <line x1="68" y1="313" x2="972" y2="313" class="rule"/>
  <text x="75" y="350" class="text tiny muted" letter-spacing="1">SELECTED LOOP</text>
  <text x="75" y="383" class="text heading">payments-service</text>
  <text x="75" y="410" class="text tiny muted">Base branch main · Internal port 4411 · Runtime 0.1.0 · 7c21a0f97b12</text>
  <rect x="760" y="351" width="196" height="40" rx="8" class="button"/>
  <text x="858" y="377" text-anchor="middle" class="text small" font-weight="650">Unregister Loop</text>
  <text x="75" y="448" class="text small muted">Available because Manager confirms this Failed Loop has no active process.</text>
  <text x="75" y="472" class="text tiny muted">Only the registry entry is removed. Git, Workflow, Task Store, and workspace data remain on disk.</text>
</svg>
