<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="890" viewBox="0 0 1040 890" role="img" aria-labelledby="title description">
  <title id="title">Synthetic Manager damaged Runtime recovery flow</title>
  <desc id="description">A synthetic before-and-after view of an invalid active Runtime and same-ID repair. The Manager requires a restart even though its Runtime ID is unchanged. This is not a browser capture.</desc>
  <defs>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #282724; }
      .muted { fill: #716e68; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .heading { font-size: 23px; font-weight: 650; }
      .title { font-size: 31px; font-weight: 700; }
      .card { fill: #fff; stroke: #dedbd4; stroke-width: 1.5; }
      .notice { fill: #f8f2e5; stroke: #e4d4ad; stroke-width: 1.2; }
      .failure { fill: #fbefed; stroke: #e6c6c0; stroke-width: 1.2; }
      .success { fill: #edf5ec; stroke: #c9dfc6; stroke-width: 1.2; }
      .rule { stroke: #e4e1da; stroke-width: 1.2; }
      .button { fill: #fff; stroke: #c9c5bc; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="1040" height="890" fill="#f3f1ec"/>
  <text x="30" y="34" class="text tiny" font-weight="700" letter-spacing="1.2">SYNTHETIC VISUAL REVIEW FIXTURE · DAMAGED RUNTIME RECOVERY</text>
  <text x="30" y="57" class="text tiny muted">Reconstructed from Manager JSX/CSS and tested feedback. IDs, paths, and repository are illustrative; not a browser capture.</text>
  <rect x="20" y="78" width="1000" height="785" rx="18" fill="#fbfaf8" stroke="#d8d5ce" stroke-width="1.5"/>
  <text x="54" y="126" class="text tiny muted" letter-spacing="1.2">LEESH LOOP</text>
  <text x="54" y="162" class="text title">Manager</text>
  <text x="54" y="190" class="text small muted">Selected Loop · Stopped · /work/demo-service</text>

  <rect x="50" y="216" width="940" height="274" rx="12" class="card"/>
  <text x="75" y="250" class="text tiny muted" letter-spacing="1">BEFORE RECOVERY</text>
  <text x="75" y="282" class="text tiny muted" letter-spacing="1">RUNTIME DISTRIBUTION</text>
  <text x="75" y="313" class="text heading">Active Runtime needs repair</text>
  <rect x="75" y="329" width="890" height="62" rx="8" class="failure"/>
  <text x="92" y="353" class="text small">The active Runtime could not be validated: contents do not match their immutable identity.</text>
  <text x="92" y="376" class="text small">Install source Runtime to repair it.</text>
  <text x="75" y="416" class="text small">Other validated Runtime distributions: <tspan font-weight="650">0.9.0 · deadbeefcafe</tspan></text>
  <text x="75" y="444" class="text tiny muted">Source checkout <tspan class="text" font-weight="650">v0.1.0 · c0ffee123456</tspan></text>
  <text x="75" y="468" class="text tiny muted">Manager service <tspan class="text" font-weight="650">v0.1.0 · c0ffee123456</tspan> · selected Loop <tspan class="text" font-weight="650">v0.9.0 · deadbeefcafe</tspan></text>
  <rect x="784" y="419" width="173" height="40" rx="8" class="button"/>
  <text x="870" y="445" text-anchor="middle" class="text small" font-weight="650">Install source Runtime</text>

  <rect x="50" y="510" width="940" height="348" rx="12" class="card"/>
  <text x="75" y="544" class="text tiny muted" letter-spacing="1">AFTER SAME-ID REPAIR</text>
  <text x="75" y="577" class="text tiny muted" letter-spacing="1">RUNTIME DISTRIBUTION</text>
  <text x="75" y="608" class="text heading">Active for new starts · 0.1.0 · c0ffee123456</text>
  <rect x="75" y="626" width="560" height="79" rx="8" class="notice"/>
  <text x="92" y="649" class="text tiny">New starts use Runtime 0.1.0 · c0ffee123456; Manager still requires a restart</text>
  <text x="92" y="669" class="text tiny">to load the active Runtime. Run leesh-loop to reopen Manager.</text>
  <text x="92" y="689" class="text tiny">Running Loops continue on their selected versions.</text>
  <text x="75" y="733" class="text tiny muted">Source checkout <tspan class="text" font-weight="650">v0.1.0 · c0ffee123456</tspan></text>
  <text x="75" y="757" class="text tiny muted">Manager service <tspan class="text" font-weight="650">v0.1.0 · c0ffee123456</tspan></text>
  <text x="75" y="781" class="text tiny muted">Selected Loop <tspan class="text" font-weight="650">v0.9.0 · deadbeefcafe</tspan></text>
  <rect x="786" y="570" width="173" height="40" rx="8" class="button"/>
  <text x="872" y="596" text-anchor="middle" class="text small" font-weight="650">Install source Runtime</text>
  <rect x="685" y="626" width="280" height="218" rx="8" class="success"/>
  <text x="701" y="651" class="text tiny" font-weight="650">Repaired Runtime 0.1.0 for future starts.</text>
  <text x="701" y="672" class="text tiny">Reopen Manager with leesh-loop to</text>
  <text x="701" y="691" class="text tiny">load the repaired Runtime.</text>
  <text x="701" y="715" class="text tiny">Running Loops and Workflow files were</text>
  <text x="701" y="734" class="text tiny">not changed; the prior Runtime failed</text>
  <text x="701" y="753" class="text tiny">validation.</text>
  <text x="701" y="777" class="text tiny">Validation: contents do not match their</text>
  <text x="701" y="796" class="text tiny">immutable identity.</text>
  <text x="701" y="820" class="text tiny">Damaged copy preserved at .damaged-…</text>
</svg>
