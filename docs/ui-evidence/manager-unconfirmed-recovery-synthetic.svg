<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1060" viewBox="0 0 1040 1060" role="img" aria-labelledby="title description">
  <title id="title">Synthetic Manager Unconfirmed ownership review path</title>
  <desc id="description">A synthetic full-page flow map showing a primary Review ownership action, expanded process diagnosis, an intervening Task workspace, and opened Logs. Lifecycle mutation actions remain unavailable. Not a browser capture.</desc>
  <defs>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #282724; }
      .muted { fill: #716e68; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .heading { font-size: 23px; font-weight: 650; }
      .title { font-size: 31px; font-weight: 700; }
      .card { fill: #fff; stroke: #dedbd4; stroke-width: 1.5; }
      .soft { fill: #f8f7f4; stroke: #e3e0d9; stroke-width: 1.2; }
      .rule { stroke: #e4e1da; stroke-width: 1.2; }
      .button { fill: #292824; stroke: #292824; stroke-width: 1.4; }
      .button-label { fill: #fff; }
      .disabled { fill: #f2f1ee; stroke: #d6d3cc; stroke-width: 1.3; }
      .failure { fill: #77521c; }
      .route { fill: none; stroke: #8b6a32; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b6a32"/>
    </marker>
  </defs>
  <rect width="1040" height="1060" fill="#f3f1ec"/>
  <text x="30" y="34" class="text tiny" font-weight="700" letter-spacing="1.2">SYNTHETIC FULL-PAGE FLOW MAP · UNCONFIRMED OWNERSHIP</text>
  <text x="30" y="57" class="text tiny muted">Reconstructed from post-review JSX/CSS. Not a browser capture. The route never enables lifecycle mutations.</text>
  <rect x="20" y="78" width="1000" height="960" rx="18" fill="#fbfaf8" stroke="#d8d5ce" stroke-width="1.5"/>

  <text x="54" y="128" class="text tiny muted" letter-spacing="1.2">LEESH LOOP</text>
  <text x="54" y="163" class="text title">Manager</text>
  <rect x="254" y="112" width="123" height="30" rx="15" fill="#f7ead2"/>
  <circle cx="270" cy="127" r="5" fill="#aa782c"/>
  <text x="283" y="133" class="text small failure" font-weight="650">Unconfirmed</text>
  <text x="395" y="134" class="text body" font-weight="650">payments-service</text>
  <text x="395" y="158" class="text small muted">/work/projects/payments-service</text>
  <text x="54" y="195" class="text small failure">Manager cannot confirm process ownership. Review the diagnosis and Logs; verify which process owns port 4411 before retrying.</text>
  <text x="54" y="217" class="text tiny muted">Start, stop, and unregister remain unavailable until Manager confirms ownership.</text>
  <rect x="54" y="232" width="178" height="37" rx="8" class="button"/>
  <text x="143" y="256" text-anchor="middle" class="text small button-label" font-weight="650">Review ownership</text>
  <text x="248" y="256" class="text small" font-weight="650">Tasks ↓</text>

  <rect x="54" y="282" width="932" height="112" rx="10" fill="#f8f7f4" stroke="#d9d5cc"/>
  <path d="M73 305 l6 6 6-6" fill="none" stroke="#55524d" stroke-width="2"/>
  <text x="101" y="314" class="text small" font-weight="650">Hide diagnosis</text>
  <text x="74" y="341" class="text tiny muted">Confirm which process owns the assigned port before retrying lifecycle actions.</text>
  <text x="74" y="368" class="text tiny" font-family="monospace">runtime API identity does not match the recorded Loop process</text>
  <text x="74" y="385" class="text small" font-weight="650" fill="#343434">Open Loop logs ↓</text>

  <rect x="50" y="420" width="940" height="204" rx="12" class="card"/>
  <text x="75" y="459" class="text heading">Tasks</text>
  <text x="965" y="459" text-anchor="end" class="text small muted">payments-service · 3 tasks</text>
  <rect x="75" y="479" width="540" height="38" rx="8" class="soft"/>
  <text x="93" y="504" class="text small muted">Find a task by title, identifier, or State</text>
  <rect x="75" y="536" width="880" height="54" rx="8" class="soft"/>
  <text x="94" y="560" class="text body" font-weight="650">Reconcile nightly payment exports</text>
  <text x="94" y="580" class="text tiny muted">PLAN-24 · Updated 14 minutes ago</text>
  <text x="75" y="609" class="text tiny muted">The primary Task surface remains unchanged; the header route jumps to diagnostics below.</text>

  <rect x="50" y="650" width="940" height="340" rx="12" class="card"/>
  <path d="M72 681 l7 7 7-7" fill="none" stroke="#55524d" stroke-width="2"/>
  <text x="101" y="690" class="text body" font-weight="650">Manage current Loop</text>
  <text x="965" y="690" text-anchor="end" class="text small muted">Runtime, Workflow, and diagnosis</text>
  <line x1="68" y1="709" x2="972" y2="709" class="rule"/>
  <text x="75" y="740" class="text tiny muted" letter-spacing="1">SELECTED LOOP</text>
  <text x="75" y="771" class="text heading">payments-service</text>
  <rect x="750" y="737" width="206" height="38" rx="8" class="disabled"/>
  <text x="853" y="762" text-anchor="middle" class="text small muted" font-weight="650">Unregister unavailable</text>
  <text x="75" y="798" class="text tiny muted">Lifecycle controls remain disabled while process ownership is uncertain.</text>
  <line x1="75" y1="818" x2="965" y2="818" class="rule"/>
  <text x="75" y="848" class="text small" font-weight="650">Workflow</text>
  <text x="965" y="848" text-anchor="end" class="text tiny muted">Compare and repair remain gated</text>
  <rect x="68" y="864" width="904" height="102" rx="8" fill="#f8f7f4" stroke="#c9c5bc" stroke-width="1.3"/>
  <path d="M86 885 l6 6 6-6" fill="none" stroke="#55524d" stroke-width="2"/>
  <text x="109" y="894" class="text small" font-weight="650">Loop logs · opened by Review ownership</text>
  <text x="91" y="926" class="text tiny muted">View startup and Symphony output</text>
  <rect x="91" y="937" width="858" height="18" rx="6" fill="#ececec"/>
  <text x="101" y="951" class="text tiny" font-family="monospace">Recorded PID responded with a different runtime identity.</text>

  <path d="M320 251 L1005 251 L1005 946 L949 946" class="route"/>
</svg>
