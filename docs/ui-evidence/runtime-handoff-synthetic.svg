<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
  <title id="title">Synthetic Runtime handoff review fixture</title>
  <desc id="description">Simulated Runtime installation state in which the new Runtime is active for future starts, the Manager still runs its old immutable distribution, and a running Loop remains pinned to its earlier version. This is not an observed Runtime update.</desc>
  <defs>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #282724; }
      .muted { fill: #716e68; }
      .tiny { font-size: 14px; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .heading { font-size: 24px; font-weight: 650; }
      .card { fill: #fff; stroke: #dedbd4; stroke-width: 1.5; }
      .soft { fill: #f8f7f4; stroke: #e3e0d9; stroke-width: 1.2; }
      .rule { stroke: #e4e1da; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1200" height="580" fill="#f3f1ec"/>
  <text x="28" y="34" class="text tiny" font-weight="700" letter-spacing="1">SYNTHETIC RUNTIME HANDOFF FIXTURE · NOT AN OBSERVED UPDATE</text>
  <text x="28" y="57" class="text tiny muted">IDs and API result are invented to illustrate the implemented state relationship. Version numbers intentionally match.</text>
  <rect x="20" y="76" width="1160" height="476" rx="16" fill="#fbfaf8" stroke="#d8d5ce" stroke-width="1.4"/>
  <text x="52" y="119" class="text tiny muted" letter-spacing="1">RUNTIME DISTRIBUTION</text>
  <text x="52" y="153" class="text heading">Active for new starts · 0.1.0 · abcdef012345</text>
  <text x="52" y="181" class="text small">Source checkout <tspan font-weight="650">0.1.0 · abcdef012345</tspan></text>
  <text x="52" y="207" class="text small">Manager service <tspan font-weight="650">0.1.0 · 111111111111</tspan> · selected Loop <tspan font-weight="650">0.1.0 · 111111111111</tspan></text>
  <rect x="52" y="228" width="1096" height="78" rx="9" fill="#f5f2e8" stroke="#d8c68f" stroke-width="1.2"/>
  <text x="72" y="258" class="text small" font-weight="650">New starts use Runtime 0.1.0 · abcdef012345; Manager still uses Runtime 0.1.0 · 111111111111.</text>
  <text x="72" y="283" class="text small">Run <tspan font-family="monospace">leesh-loop</tspan> to reopen Manager on the active Runtime. Running Loops continue on their selected versions.</text>
  <rect x="52" y="324" width="1096" height="54" rx="9" class="soft"/>
  <text x="72" y="347" class="text small" font-weight="650">After CLI restart: Manager service → 0.1.0 · abcdef012345</text>
  <text x="72" y="368" class="text tiny muted">The running Loop remains on 0.1.0 · 111111111111; its Workflow and Task Store are unchanged.</text>
  <line x1="52" y1="396" x2="1148" y2="396" class="rule"/>
  <text x="52" y="426" class="text small" font-weight="650">Synthetic API response shape</text>
  <text x="52" y="454" class="text tiny" font-family="monospace">changed: true  ·  manager_restart_required: true</text>
  <text x="52" y="477" class="text tiny" font-family="monospace">previous.id: 111111111111…  ·  active.id: abcdef012345…</text>
  <text x="52" y="513" class="text tiny muted">Expected UI text and fields are drawn from the final source. This fixture does not claim install, restart, or live Loop preservation was executed.</text>
</svg>
