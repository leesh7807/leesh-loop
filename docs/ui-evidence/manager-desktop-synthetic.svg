<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1340" viewBox="0 0 1440 1340" role="img" aria-labelledby="title description">
  <title id="title">Synthetic desktop Manager review fixture</title>
  <desc id="description">A labeled reconstruction of the Manager's Task-first hierarchy, repository switcher, Runtime identity panel, and an alternate Unconfirmed state. This is not a browser capture.</desc>
  <defs>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #282724; }
      .muted { fill: #716e68; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .heading { font-size: 23px; font-weight: 650; }
      .title { font-size: 31px; font-weight: 700; }
      .card { fill: #fff; stroke: #dedbd4; stroke-width: 1.5; }
      .soft { fill: #f8f7f4; stroke: #e3e0d9; stroke-width: 1.2; }
      .rule { stroke: #e4e1da; stroke-width: 1.2; }
      .button { fill: #292824; }
      .button-label { fill: #fff; }
      .button-secondary { fill: #fff; stroke: #c9c5bc; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="1440" height="1340" fill="#f3f1ec"/>
  <text x="34" y="35" class="text tiny" font-weight="700" letter-spacing="1.3">SYNTHETIC VISUAL REVIEW FIXTURE · DESKTOP 1440 PX</text>
  <text x="34" y="56" class="text tiny muted">Reconstructed from PR #121 and post-review Manager source. Not a browser capture. Names, tasks, versions, and IDs below are illustrative.</text>
  <rect x="24" y="76" width="1392" height="1210" rx="18" fill="#fbfaf8" stroke="#d8d5ce" stroke-width="1.5"/>

  <!-- Manager header and selected Loop -->
  <text x="58" y="127" class="text tiny muted" letter-spacing="1.2">LEESH LOOP</text>
  <text x="58" y="162" class="text title">Manager</text>
  <rect x="263" y="111" width="90" height="30" rx="15" fill="#e9eee9"/>
  <circle cx="280" cy="126" r="5" fill="#347a54"/>
  <text x="293" y="132" class="text small" font-weight="650">Stopped</text>
  <text x="370" y="133" class="text body" font-weight="650">payments-service</text>
  <text x="370" y="157" class="text small muted">/work/projects/payments-service</text>
  <rect x="1118" y="113" width="116" height="42" rx="9" class="button"/>
  <text x="1176" y="140" text-anchor="middle" class="text small button-label" font-weight="650">Start Loop</text>
  <text x="1252" y="140" class="text small" font-weight="650">Tasks ↓</text>

  <!-- Repositories disclosure open -->
  <rect x="52" y="186" width="1336" height="205" rx="12" class="card"/>
  <path d="M75 217 l7 7 7-7" fill="none" stroke="#55524d" stroke-width="2"/>
  <text x="102" y="226" class="text body" font-weight="650">Repositories</text>
  <text x="1325" y="226" text-anchor="end" class="text small muted">Current: payments-service · 2 managed Loops</text>
  <line x1="70" y1="245" x2="1370" y2="245" class="rule"/>
  <text x="76" y="279" class="text heading">Switch Loop</text>
  <text x="252" y="279" class="text small muted">Select a repository to open its Tasks and execution state.</text>
  <rect x="74" y="296" width="590" height="48" rx="9" fill="#f3f6f2" stroke="#8fa393" stroke-width="1.4"/>
  <text x="94" y="326" class="text body" font-weight="650">payments-service</text>
  <rect x="500" y="307" width="76" height="26" rx="13" fill="#e9eee9"/>
  <text x="538" y="325" text-anchor="middle" class="text tiny" font-weight="650">Stopped</text>
  <text x="94" y="339" class="text tiny muted">/work/projects/payments-service</text>
  <rect x="682" y="296" width="680" height="48" rx="9" class="soft"/>
  <text x="702" y="326" class="text body" font-weight="600">leesh-loop</text>
  <rect x="1196" y="307" width="76" height="26" rx="13" fill="#e9eee9"/>
  <text x="1234" y="325" text-anchor="middle" class="text tiny" font-weight="650">Stopped</text>
  <text x="702" y="339" class="text tiny muted">/work/leesh-loop</text>
  <text x="76" y="372" class="text tiny muted">Add a Git repository below. The Manager keeps its Workflow, Task Store, and workspace in separate user data.</text>

  <!-- Task work remains central and precedes management -->
  <rect x="52" y="413" width="1336" height="355" rx="12" class="card"/>
  <text x="76" y="455" class="text heading">Tasks</text>
  <text x="1348" y="455" text-anchor="end" class="text small muted">payments-service · 3 tasks</text>
  <rect x="76" y="472" width="540" height="40" rx="8" class="soft"/>
  <text x="94" y="498" class="text small muted">Find a task by title, identifier, or State</text>
  <rect x="76" y="526" width="64" height="29" rx="14" fill="#ece9e2"/>
  <text x="108" y="546" text-anchor="middle" class="text tiny" font-weight="650">Active 2</text>
  <text x="159" y="546" class="text tiny muted">Ready</text>
  <text x="216" y="546" class="text tiny muted">In Progress</text>
  <text x="324" y="546" class="text tiny muted">Human Review</text>
  <line x1="76" y1="568" x2="1360" y2="568" class="rule"/>
  <text x="78" y="596" class="text tiny muted" font-weight="700" letter-spacing=".8">IN PROGRESS</text>
  <rect x="76" y="608" width="842" height="57" rx="8" class="soft"/>
  <text x="95" y="633" class="text body" font-weight="650">Reconcile nightly payment exports</text>
  <text x="95" y="653" class="text tiny muted">PLAN-24 · Updated 14 minutes ago · 2 blocked tasks</text>
  <rect x="76" y="674" width="842" height="57" rx="8" class="soft"/>
  <text x="95" y="699" class="text body" font-weight="650">Add idempotency key to refund endpoint</text>
  <text x="95" y="719" class="text tiny muted">PLAN-31 · Updated yesterday</text>
  <rect x="954" y="588" width="406" height="155" rx="10" fill="#f8f7f4" stroke="#e3e0d9"/>
  <text x="978" y="620" class="text small" font-weight="650">Publish an Accepted Plan</text>
  <text x="978" y="646" class="text tiny muted">Plan title and Objective are required.</text>
  <rect x="978" y="660" width="358" height="34" rx="6" fill="#fff" stroke="#ddd9d1"/>
  <text x="990" y="682" class="text tiny muted"># Plan title</text>
  <rect x="978" y="705" width="142" height="30" rx="7" class="button"/>
  <text x="1049" y="725" text-anchor="middle" class="text tiny button-label" font-weight="650">Publish Plan</text>
  <text x="1135" y="725" class="text tiny muted">State: Ready</text>

  <!-- Secondary management section expanded -->
  <rect x="52" y="790" width="1336" height="350" rx="12" class="card"/>
  <path d="M75 821 l7 7 7-7" fill="none" stroke="#55524d" stroke-width="2"/>
  <text x="102" y="830" class="text body" font-weight="650">Manage current Loop</text>
  <text x="1360" y="830" text-anchor="end" class="text small muted">Runtime, Workflow, and diagnosis</text>
  <line x1="70" y1="849" x2="1370" y2="849" class="rule"/>
  <text x="78" y="882" class="text tiny muted" letter-spacing="1">RUNTIME DISTRIBUTION</text>
  <text x="78" y="914" class="text heading">Active for new starts · 0.1.0 · 7c21a0f97b12</text>
  <text x="78" y="943" class="text small muted">Updating installs the Runtime from this checkout for future Loop starts.</text>
  <text x="78" y="966" class="text small muted">Running Loops keep their pinned Runtime; Workflow changes use a separate action.</text>
  <text x="78" y="997" class="text small">Source checkout <tspan font-weight="650">v0.1.0</tspan> · <tspan font-family="monospace">7c21a0f97b12</tspan></text>
  <text x="78" y="1025" class="text small">Manager service <tspan font-weight="650">0.1.0 · 7c21a0f97b12</tspan> <tspan class="muted">·</tspan> selected Loop <tspan font-weight="650">0.1.0 · 7c21a0f97b12</tspan></text>
  <rect x="1110" y="875" width="244" height="42" rx="8" class="button-secondary"/>
  <text x="1232" y="902" text-anchor="middle" class="text small" font-weight="650">Install source Runtime</text>
  <line x1="76" y1="1048" x2="1360" y2="1048" class="rule"/>
  <text x="78" y="1080" class="text small" font-weight="650">Workflow</text>
  <text x="1338" y="1080" text-anchor="end" class="text tiny muted">Current · This Workflow matches the current template.</text>
  <line x1="76" y1="1097" x2="1360" y2="1097" class="rule"/>
  <text x="78" y="1124" class="text small" font-weight="650">Loop logs</text>
  <text x="1338" y="1124" text-anchor="end" class="text tiny muted">View startup and Symphony output</text>

  <!-- Alternate status state, not simultaneous with Stopped state above -->
  <rect x="52" y="1160" width="1336" height="101" rx="12" fill="#fffaf0" stroke="#dfc58e" stroke-width="1.4"/>
  <text x="76" y="1192" class="text tiny" fill="#77521c" font-weight="700" letter-spacing=".9">ALTERNATE STATE · SYNTHETIC UNCONFIRMED EXAMPLE</text>
  <rect x="76" y="1207" width="105" height="30" rx="15" fill="#f7ead2"/>
  <text x="128" y="1227" text-anchor="middle" class="text tiny" fill="#77521c" font-weight="700">Unconfirmed</text>
  <text x="197" y="1227" class="text small">Manager cannot verify process ownership. Start, stop, and unregister remain unavailable until ownership is confirmed.</text>
  <text x="76" y="1250" class="text tiny muted">This panel is a separate state example; it is not part of the Stopped screen above.</text>
</svg>
