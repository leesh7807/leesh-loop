[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-plan-publisher"
version = "0.1.0"
description = "Publish completed plan artifacts as deterministic Notion coordination tasks"
requires-python = ">=3.10"

[project.scripts]
notion-plan-publisher = "notion_plan_publisher.cli:main"

[tool.setuptools.packages.find]
include = ["notion_plan_publisher*"]
